  needs_review: false
  rationale: The inventory counts exactly 10 active learned skills, so consolidation is triggered before any new skill is added. Three of them govern one workflow, signing in and recovering access. agent_side_auth_gate already cross references serial_browser_signin for queue order, serial_browser_signin covers the serial shared session discipline from the 2026-10-24 parallel sign-in lock, and credential_save_and_verify covers saving and read back verification at the moment a login succeeds in assistant-msg-ffd17d31 and assistant-msg-e4b8703a. Merging the queue and save methods into agent_side_auth_gate keeps one access skill that a loop finds before any sign-in, and the two superseded skills are retired in this same batch. prepaid_api_credit_guard, legacy_loop_takeover_proof and winner_copy_by_measurement stay separate because their finance, takeover and creative measurement methods are distinct.
