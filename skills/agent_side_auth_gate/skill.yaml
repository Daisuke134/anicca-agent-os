    success_criterion: Within 14 days after consolidation, no password, MFA, biometric or device step is presented to the user, no sign-in batch launches two logins for the same account in parallel, every sampled successful login has a shared store entry read back and passing a length, format and authenticated test before the session ends, and zero later sessions fail to log in because a prior login was unsaved or saved corrupted.
