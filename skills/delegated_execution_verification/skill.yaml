name: delegated_execution_verification
title: Verify Delegated Execution Lands
description: Verify a delegated run is actually executing and lands a real artifact, for use whenever work is handed to another agent, a local CLI worker, or a cloud worker.
category: Work and knowledge
include_in_prompt: true
skill_improvement:
  managed: true
  status: active
  evidence_handles:
